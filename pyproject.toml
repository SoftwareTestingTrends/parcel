[project]
name = "parcel"
version = "0.1.0"
description = "Parcel: a support assistant for Hollow Lane, a fictional online homeware shop (course demo app for AI evals)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2,<3",
    "claude-agent-sdk>=0.2",
]

[project.scripts]
parcel = "parcel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["course"]  # course files are teaching material, kept as recorded

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
